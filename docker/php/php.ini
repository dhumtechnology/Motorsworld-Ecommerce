[PHP]
sys_temp_dir = /var/www/html/storage/framework/cache
error_reporting = 6143

; OPcache: vendor y app en volumen Linux dentro del contenedor (ver docker-compose).
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Un producto puede llevar varias fotos (5 MB c/u) + ficha PDF (10 MB).
upload_max_filesize = 16M
post_max_size = 128M
max_file_uploads = 40
memory_limit = 256M
max_execution_time = 180
max_input_time = 180
max_input_vars = 5000
